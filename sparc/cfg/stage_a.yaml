# Stage A: 2D perception on public datasets (road users, traffic elements, lanes, drivable area), one GPU.
model:
  backbone: vit_t16_dinov3        # replace by the Phase-0 bake-off winner
  pretrained: true
  imgsz: [384, 640]
  hfov: 60.0
  decoder_layers: 3
  n_agents: 200
  n_elements: 50
  n_lanes: 24
  bev: false
  lane_aux: true
aug:
  scale: [0.7, 1.3]
  translate: 0.1
  hflip: 0.5
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  height_jitter: 0.15
distill:
  enabled: true
  teacher: dinov3_b
  weight: 1.0
epochs: 30
batch: 16
workers: 8
lr: 2.0e-4
backbone_lr_mult: 0.1
weight_decay: 1.0e-4
warmup_iters: 1000
grad_clip: 0.1
amp: bf16
ema: 0.9998
log_every: 50
fitness: {agents_mAP50-95: 0.4, da_mIoU: 0.2, lane_F1: 0.2, bdd10_mAP50-95: 0.2}
